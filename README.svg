link Ingreditent to Role--><!--MD5=[e77f9b9e6e04980ecee74f55409b86e4]
@startuml
skinparam backgroundColor #123749
skinparam roundcorner 20
skinparam classfontcolor lemon chiffon
skinparam titlefontcolor linen
skinparam arrowfontcolor linen
skinparam attributefontcolor linen

skinparam class {
BackgroundColor #123749
ArrowColor #EEB258
BorderColor #EEB258
AttributeFontColor linen
}
title Class diagram

class Ingreditent {
  - id: Int
  - name: String
  - type: String
  - seasonal: Bool
  - seasons: Int[]
}

class User {
  - id: Long
  - name: String
  - email: String
  - role: Collection<Role>
}

class Role {
  - id: Long
  - name: String
}

@enduml

